<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            overflow-y: auto;
            height: 100vh;
        }

        .support-container {
            padding: 24px;
        }

        .support-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 24px;
            color: var(--text-primary, #333);
        }

        .support-subtitle {
            font-weight: 600;
            font-size: 20px;
            margin-bottom: 16px;
            color: var(--text-primary, #333);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary, #666);
            font-size: 14px;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--oceanic, #667eea);
        }

        button {
            background: var(--oceanic, #667eea);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--cornflower, #5a67d8);
            transform: translateY(-1px);
        }

        .ticket {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .ticket-subject {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .ticket-category {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            background: #e9ecef;
            font-weight: 500;
        }

        .ticket-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 8px;
            font-weight: 500;
        }

        .status-open { background: #d4edda; color: #155724; }
        .status-in_progress { background: #fff3cd; color: #856404; }
        .status-closed { background: #f8d7da; color: #721c24; }

        .ticket-description {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .ticket-date {
            font-size: 11px;
            color: #999;
            margin-top: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: var(--oceanic, #667eea);
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }

        .category-stats {
            margin-top: 24px;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="support-container" id="app">
        <div class="loading">Загрузка...</div>
    </div>
    
    <script>
        let csrfToken = null;

        async function fetchCsrfToken() {
            try {
                const response = await fetch('/api/csrf-token', {
                    method: 'GET',
                    credentials: 'include'
                });
                if (response.ok) {
                    const data = await response.json();
                    csrfToken = data.csrf_token || data.token;
                }
            } catch (error) {
                console.warn('Failed to fetch CSRF token:', error);
            }
        }

        async function fetchWithAuth(url, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (csrfToken && (options.method === 'POST' || options.method === 'PUT' || options.method === 'PATCH' || options.method === 'DELETE')) {
                headers['X-CSRF-Token'] = csrfToken;
            }
            
            const response = await fetch(url, {
                ...options,
                headers: headers,
                credentials: 'include'
            });
            
            if (response.status === 403 && (options.method === 'POST' || options.method === 'PUT' || options.method === 'PATCH' || options.method === 'DELETE')) {
                await fetchCsrfToken();
                headers['X-CSRF-Token'] = csrfToken;
                const retryResponse = await fetch(url, {
                    ...options,
                    headers: headers,
                    credentials: 'include'
                });
                if (!retryResponse.ok) {
                    throw new Error(`HTTP ${retryResponse.status}`);
                }
                return retryResponse.json();
            }
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            if (response.status === 204) {
                return null;
            }
            
            return response.json();
        }

        async function createTicket(data) {
            return await fetchWithAuth('/api/support/tickets', {
                method: 'POST',
                body: JSON.stringify(data)
            });
        }

        async function getUserTickets() {
            const response = await fetchWithAuth('/api/support/tickets');
            return response.tickets || [];
        }

        async function getStats() {
            return await fetchWithAuth('/api/support/stats');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadNewForm() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <h1 class="support-title">Новое обращение</h1>
                <form id="supportForm">
                    <div class="form-group">
                        <label>Категория</label>
                        <select name="category_id" required>
                            <option value="1">Баг / Ошибка</option>
                            <option value="2">Предложение / Идея</option>
                            <option value="3">Продуктовая жалоба</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Тема</label>
                        <input name="title" type="text" required placeholder="Кратко опишите проблему" maxlength="255" />
                    </div>
                    <div class="form-group">
                        <label>Описание</label>
                        <textarea name="description" rows="6" required placeholder="Подробное описание..." maxlength="1000"></textarea>
                    </div>
                    <button type="submit">Отправить обращение</button>
                </form>
            `;

            const form = document.getElementById('supportForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const formData = new FormData(form);
                const data = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    category_id: parseInt(formData.get('category_id'))
                };
                
                try {
                    const newTicket = await createTicket(data);
                    alert('Обращение успешно создано!');
                    form.reset();
                    
                    window.parent.postMessage({ 
                        type: 'support:ticketCreated', 
                        data: newTicket 
                    }, '*');
                } catch (error) {
                    alert('Ошибка при создании: ' + error.message);
                }
            });
        }

        async function loadMyTickets() {
            const app = document.getElementById('app');
            
            try {
                const tickets = await getUserTickets();
                
                if (!tickets || tickets.length === 0) {
                    app.innerHTML = '<div class="empty-state">У вас пока нет обращений</div>';
                    return;
                }

                const statusMap = {
                    1: 'Открыто',
                    2: 'В работе',
                    3: 'Ожидает ответа',
                    4: 'Закрыто'
                };

                const categoryMap = {
                    1: 'Баг',
                    2: 'Предложение',
                    3: 'Жалоба'
                };

                let html = '<h1 class="support-title">Мои обращения (' + tickets.length + ')</h1>';
                
                for (var i = 0; i < tickets.length; i++) {
                    var ticket = tickets[i];
                    var statusClass = '';
                    var statusText = statusMap[ticket.status_id] || 'Неизвестно';
                    
                    if (ticket.status_id === 1) statusClass = 'status-open';
                    else if (ticket.status_id === 2) statusClass = 'status-in_progress';
                    else if (ticket.status_id === 4) statusClass = 'status-closed';
                    
                    var categoryText = categoryMap[ticket.category_id] || ticket.category_name;
                    var date = new Date(ticket.created_at).toLocaleString('ru-RU');
                    
                    html += `
                        <div class="ticket">
                            <div class="ticket-header">
                                <span class="ticket-subject">${escapeHtml(ticket.title)}</span>
                                <span class="ticket-category">${escapeHtml(categoryText)}</span>
                            </div>
                            <div class="ticket-description">${escapeHtml(ticket.description)}</div>
                            <div>
                                <span class="ticket-status ${statusClass}">${statusText}</span>
                            </div>
                            <div class="ticket-date">
                                ${date}
                            </div>
                        </div>
                    `;
                }
                
                app.innerHTML = html;
            } catch (error) {
                app.innerHTML = '<div class="empty-state">Ошибка загрузки обращений: ' + error.message + '</div>';
            }
        }

        async function loadStats() {
            const app = document.getElementById('app');
            
            try {
                const stats = await getStats();
                
                const statusMap = {
                    'open': 'Открыто',
                    'in_progress': 'В работе',
                    'waiting_user': 'Ожидает ответа',
                    'closed': 'Закрыто'
                };

                const html = `
                    <h1 class="support-title">Статистика обращений</h1>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${stats.total || 0}</div>
                            <div class="stat-label">Всего обращений</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.open || 0}</div>
                            <div class="stat-label">${statusMap.open}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.in_progress || 0}</div>
                            <div class="stat-label">${statusMap.in_progress}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.closed || 0}</div>
                            <div class="stat-label">${statusMap.closed}</div>
                        </div>
                    </div>
                    
                    <h2 class="support-subtitle">По категориям</h2>
                    <div class="category-stats">
                        <div class="category-item">
                            <span>Баги</span>
                            <strong>${stats.bug_count || 0}</strong>
                        </div>
                        <div class="category-item">
                            <span>Предложения</span>
                            <strong>${stats.suggestion_count || 0}</strong>
                        </div>
                        <div class="category-item">
                            <span>Жалобы</span>
                            <strong>${stats.complaint_count || 0}</strong>
                        </div>
                    </div>
                    ${stats.average_rating ? `
                        <div class="category-stats">
                            <div class="category-item">
                                <span>Средняя оценка</span>
                                <strong>${stats.average_rating.toFixed(1)} / 5</strong>
                            </div>
                        </div>
                    ` : ''}
                `;
                
                app.innerHTML = html;
            } catch (error) {
                app.innerHTML = '<div class="empty-state">Ошибка загрузки статистики: ' + error.message + '</div>';
            }
        }

        async function init() {
            await fetchCsrfToken();
            
            var urlParams = new URLSearchParams(window.location.search);
            var view = urlParams.get('view') || 'new';
            
            if (view === 'my') {
                await loadMyTickets();
            } else if (view === 'stats') {
                await loadStats();
            } else {
                await loadNewForm();
            }
        }

        init();

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'support:switchTab') {
                var newView = event.data.view;
                if (newView === 'my') {
                    loadMyTickets();
                } else if (newView === 'stats') {
                    loadStats();
                } else {
                    loadNewForm();
                }
            }
        });
    </script>
</body>
</html>
